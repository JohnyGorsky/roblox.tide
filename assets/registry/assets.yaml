- id: GB-STARTER-LAUNCH
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-BOAT-STARTER
  place: game
  roblox_path: Workspace.StarterLaunch
  feature: GAME-0001
  notes: >-
    THE WHOLE SHIP IS A GRAYBOX, not just her fittings. The hull is one 40 x 14 x 5 DiamondPlate box in
    Wet Steel, and every fitting on it is another box welded on: HelmConsole (3 x 3 x 1.5), Binnacle
    (1.8 x 0.6 x 1.8) and DamageControl (2.5 cube). All of it is built at RUN TIME by
    VesselServer.buildVessel, so it does not exist in Edit and the graybox audit reports it as
    runtime-only unless the audit is run in Play. Tagged Graybox on the MODEL with
    attribute GrayboxId=GB-STARTER-LAUNCH - one placeholder, not four.
    Deliberate, not neglect: job 021 built the KIT and decision 0009 is explicit that the starter launch
    is the kit's first customer rather than the thing being built. Real geometry replaces all of it, and
    the compass was approved by eye on 2026-08-21 as a READING, not as a look.
  survives_the_restyle: >-
    What the new geometry must keep, because these are DECISIONS wearing the appearance of styling.
    (1) The compass is a physical instrument on the vessel, never a screen overlay - decision 0014 is
    explicit that a HUD heading makes The Wall's blindness free. (2) It is self-lit, LightInfluence 0, or
    it cannot be read at The Wall's brightness of 0.30. (3) Nothing may ever fault or destroy it; it is
    the floor beneath pillar 6, and the thing to threaten instead is the CHART. (4) The card rotates under
    a fixed lubber line, not a needle over a fixed card - that is what makes it report which way YOU are
    pointing. (5) Whatever face it sits on must be SQUARE, or a round card renders as a stadium; the
    binnacle exists as its own part for that reason alone. (6) It is found by CollectionService tag
    VesselCompassCard, never by instance path (finding 0020). (7) Its loop is on Heartbeat, not
    RenderStepped, or it stops running whenever the window is not rendering (finding 0022).
    Also keep: the helm and the damage-control locker at OPPOSITE ends of the deck - the distance between
    them is the crew-coordination mechanic (decision 0014), not an accident of layout. And read
    finding 0021 first: the spec labels +Z as the bow while she drives toward -Z, so socket positions do
    not mean what their names say.
- id: ASSET-LOBBY-ISLAND
  type: terrain
  status: IMPLEMENTED
  source: claude
  place: lobby
  roblox_path: Terrain (centred on origin)
  feature: GAME-0013
  notes: >-
    The lobby hub island, sculpted procedurally in job 024 at the user's request (overriding GROUND-RULES
    line 40, which assigns hand-sculpted islands to the human). NOT a graybox - this is the real thing.
    600 studs across overall; a genuinely FLAT plateau at Y=+14, 350 studs across, which is a functional
    requirement rather than a look: party pads get placed on it in the editor (Planned 0002).
    Profile: flat top to r=175, gentle upper beach to r=240, a STEEP face across the waterline to r=248,
    then an underwater shelf to r=300. Coastline irregularity comes from noise on the band RADII rather
    than on the heights, so the outline wanders while the top stays perfectly level - measured as ONE
    distinct surface height across 4,404 columns.
    The steep face is not a style choice: land whose surface sits between the water level and about +8
    renders as hole-riddled sheets, so the profile crosses that band in roughly one voxel column. Measured
    240 columns in 0..+8 around a ~400-column shoreline ring, which is the floor for any land meeting
    water, not a defect.
    Painted Sand / Grass / LeafyGrass / Rock, with the sand-grass line following a noisy height contour
    (clamped below the plateau, or patches of the flat top come out sand - which happened on the first pass).
    GB_SpawnDock was moved to r=222..286 on the -X bearing as a jetty running from the beach crest out over
    20 studs of water; the SpawnLocation sits on the plateau.
- id: GB-GAME-START-ISLAND
  type: graybox
  status: GRAYBOX
  source: claude
  represents: ASSET-START-ISLAND
  place: game
  roblox_path: Terrain (centred on origin); marker part Workspace.GB_StartIslandMarker
  feature: GAME-0001
  notes: >-
    Where the crew stands for the five-minute boarding grace (decision 0024), sculpted in job 024. Same
    technique as the lobby hub, scaled: 120 studs across, flat plateau at Y=+12 and 60 studs across, bands
    at 30/42/47/60. Measured ONE distinct plateau height across 112 columns and only 19 shelf-artifact
    columns.
    Registered as a graybox rather than final because it is functional geometry that has had no art pass -
    the LOBBY island is the one the user asked to be a real sculpt. Terrain cannot carry a
    CollectionService tag, so a transparent marker part at the centre holds GrayboxId for the audit.
    Its radius is set by the launch: VesselServer spawns it at (70,0,0) with a 14-wide hull, so the outer
    shelf stops at 60. Verified after the fill - the spawn point reads open water with the seabed 56 studs
    down, and the port side at (63,0,0) is 20 studs clear of the 1.8-stud draft.
- id: GB-TENDER
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-BOAT-TENDER
  place: game
  roblox_path: Workspace.Tender (runtime-built by TenderServer)
  feature: GAME-0001
  notes: >-
    The fuel-free rescue boat (job 023, decision 0024). Built through the vessel KIT rather than hand-rolled -
    a second Vessel.Spec at 6 x 2.5 x 12, density 1.2, draft 0.8, four buoyancy points - so it inherits the
    clamped buoyancy that stopped the launch destroying itself in job 021, and it is the first real test that
    decision 0009's derivations hold at a twentieth of the launch's mass (216 against 4200).
    A WoodPlanks box until it earns a model. Runtime-built, so an Edit-mode graybox audit reports it as
    runtime-only.
    HARD CONSTRAINT ON ANY REPLACEMENT: cruise must stay under 8.75 studs/s, which is
    StormFront.ADVANCE_RATE / GAIN_PER_STUD. A fuel-free boat faster than that gains ground on the storm
    forever and makes the launch, and the whole fuel economy it exists to consume, pointless. Measured at 4.82
    studs/s settled with the front still closing at -13.80.
- id: GB-FUEL-BARREL
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-FUEL-BARREL
  place: game
  roblox_path: Workspace.FuelBarrel x4 (runtime-built by TenderServer)
  feature: GAME-0001
  notes: >-
    Drifting diesel barrels, 4 of them at 200-400 studs, 35 fuel each against the launch's 100 capacity (job
    023). A CorrodedMetal cylinder until group 03's real barrel exists - that group already plans both a jerry
    can and a barrel, so this is a placeholder with a known replacement.
    ANCHORED and positioned onto the wave surface each frame rather than floated: terrain water buoys
    unanchored parts toward a FLAT Y=0 plane (finding 0008), which would fight the wave field and read as
    jitter. Nothing about a barrel needs simulating - it needs to look like it is bobbing and to be reachable.
    The 200-400 band is decision 0024's cost table: a round trip at the tender's 6 studs/s costs 22-44% of the
    storm's 4200-stud cushion. Keep that band when replacing them; the distance IS the mechanic.
- id: GB-RADAR-STATION
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-RADAR-MK1
  place: game
  roblox_path: Workspace.<vessel>.RadarConsole + .RadarPedestal + .RadarAerial + .RadarMast (runtime-built)
  feature: GAME-0002
  notes: >-
    The radar station, built at run time by RadarServer (job 026). Four boxes: a 4 x 2.8 x 0.3 screen on a
    2.4 x 2.2 x 1.6 pedestal at the radarConsole socket, and a 4.5-stud aerial bar on a mast at the radar
    socket. Runtime-built, so an Edit-mode graybox audit reports it as runtime-only.
    WHAT MUST SURVIVE A REPLACEMENT, because these are decisions rather than styling:
    (1) The screen is VERTICAL and its facing is set by rotating the part so its own LookVector points aft -
    a text-bearing SurfaceGui on a Top face comes out sideways, because a top face maps its up-axis to one of
    the part's horizontal axes. The compass gets away with a top face only because a compass card is
    rotationally symmetric.
    (2) The face carrying the scope must be able to hold a SQUARE dial, or the circle becomes an ellipse and
    every bearing drawn on it is a lie.
    (3) Self-lit, LightInfluence 0 - the legend and the failure message must be readable at The Wall's
    brightness of 0.30 even though the radar is dead there.
    (4) The console stays AWAY from the helm. The distance is the mechanic: watching the radar has to be a job
    somebody takes rather than something the driver does with a glance.
    (5) The aerial is ANCHORED and repositioned each frame, not welded and spun. Spinning a part welded into a
    moving physics assembly fights the solver, which is how job 021 lost a hull.
    Positions are provisional - the user places all instruments once the real hull exists.
- id: GB-ISLAND-PROPS
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-ISLAND-PROPS
  place: game
  roblox_path: Workspace.<island>.Props.GB_Wreck + .GB_Camp + .GB_Rise (runtime-built, 3 per island)
  feature: GAME-0005
  notes: >-
    Graybox props at the manifest's three DRY zones on every pasted island, built at run time by
    IslandServer (job 027) - so an Edit-mode audit reports them as runtime-only, and there are 12 of them
    with four islands placed. Slate boxes and cylinders, no detail: a wreck reads as a wreck because it is a
    tilted slab.
    GB_Wreck  - an 18 x 7 x 6 hull fragment tipped over, a rib, a flat tarp.
    GB_Camp   - a 9 x 6 x 7 tent, a firepit disc, a drying rack.
    GB_Rise   - a 26-wide x 6-thick mound disc, a dead tree, a boulder.
    WHAT MUST SURVIVE A REPLACEMENT:
    (1) The RISE IS A PROP, NOT TERRAIN. The plateau is deliberately flat to one voxel so that markers and
    party-pad-style placements can rely on it; sculpting a hill into it would give that up for scenery that a
    mesh does better.
    (2) Props are seated by RAYCAST against the terrain that actually pasted, never at a stored height. If
    the ground is not there the island is skipped instead of props floating over open water.
    (3) A cylinder's axis is its LOCAL X, so a low disc is Size (thickness, diameter, diameter) rotated 90
    degrees about Z. Size (26, 6, 26) builds a 26-stud tower, which is what the first version did.
    The real props become an asset table once the zone shapes are settled - see the job 027 summary.
