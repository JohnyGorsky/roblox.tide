# Asset registry for The Last Tide.
#
# `place` says which Roblox place the asset must exist in (see docs/systems/places/README.md):
#   game        The Last Tide Game (100885379547959) - expedition content
#   lobby       The Last Tide (91870148721134) - between-run content
#   game, lobby needed in both; the lobby copy is normally a Shipyard/roster display
#               version, so it may be a lower-detail or non-functional variant
#
# `roblox_path` is the path WITHIN that place. Bare service paths are ambiguous without `place`.

assets:
