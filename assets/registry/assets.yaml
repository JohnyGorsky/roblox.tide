# Asset registry for The Last Tide.
#
# `place` says which Roblox place the asset must exist in (see docs/systems/places/README.md):
#   game        The Last Tide Game (100885379547959) - expedition content
#   lobby       The Last Tide (91870148721134) - between-run content
#   game, lobby needed in both; the lobby copy is normally a Shipyard/roster display
#               version, so it may be a lower-detail or non-functional variant
#
# `roblox_path` is the path WITHIN that place. Bare service paths are ambiguous without `place`.

assets:
- id: ASSET-BOAT-STARTER
  type: model
  status: IDEA
  source: meshy
  roblox_path: ServerStorage.Assets.Boats.StarterBoat
  place: game, lobby
  place_notes: Playable in game; displayed in the lobby Shipyard as the starting vessel.
  feature: GAME-0001
  notes: Battered motor launch / ex-military utility boat.
- id: ASSET-RADAR-MK1
  type: model
  status: IDEA
  source: meshy
  roblox_path: ServerStorage.Assets.BoatModules.RadarMk1
  place: game, lobby
  place_notes: Functional in game; lobby needs it to preview permanent radar upgrades.
  feature: GAME-0002
  notes: Keep rotating antenna as a separate movable part.
- id: ASSET-SHARK-01
  type: rig
  status: IDEA
  source: meshy
  roblox_path: ServerStorage.Assets.Enemies.Shark
  place: game
  feature: GAME-0006
  notes: Needs swim, bite, ram, hit and death animations.
- id: ASSET-ISLAND-LIGHTHOUSE
  type: island_template
  status: IDEA
  source: mixed
  roblox_path: ServerStorage.Assets.Islands.Lighthouse
  place: game
  feature: GAME-0005
  notes: Curated terrain + props + gameplay markers.
- id: ASSET-PATROL-BOAT-01
  type: model
  status: IDEA
  source: meshy
  roblox_path: ServerStorage.Assets.Vessels.PatrolBoat01
  place: game, lobby
  place_notes: Shown in the lobby as a Shipyard construction project before it is owned.
  feature: GAME-0008
  notes: Future larger vessel; keep bridge/radar/hardpoints and possible interior
    sections modular.
- id: ASSET-NPC-ENGINEER-01
  type: rig
  status: IDEA
  source: meshy
  roblox_path: ServerStorage.Assets.Crew.Engineer01
  place: game, lobby
  place_notes: Performs tasks in game; shown in the lobby crew roster.
  feature: GAME-0009
  notes: Needs repair, carry, idle, walk/run and interaction animations.
- id: ASSET-SKY-OVERCAST
  type: skybox
  status: IDEA
  source: store
  roblox_path: Lighting.Sky
  place: game
  place_notes: Blocks the cold-ocean look; see docs/build/01-sea.md finding 1.
  feature: GAME-0011
  notes: Overcast/storm skybox set. PROVEN BLOCKER - job 007 established that neither Fog nor
    Atmosphere can make Roblox's clear-day sky overcast, so the art direction cannot be reached
    without this. Need at least 3 (overcast day, storm, night); ideally one per sea stage (7).
    The default tropical Sky is parked in ServerStorage as Sky_DefaultTropical_PARKED.
- id: ASSET-SEABED-SAND
  type: terrain
  status: IMPLEMENTED
  source: studio
  roblox_path: Workspace.Terrain
  place: game
  feature: GAME-0011
  notes: Sand seabed -64..-56 with water -56..0 over 6144x6144 studs. Verified by voxel read-back.
- id: ASSET-LOBBY-HARBOUR-DOCK
  type: model
  status: IDEA
  source: meshy
  roblox_path: Workspace.Harbour.MainDock
  place: lobby
  feature: GAME-0013
  notes: The real main dock. Weathered timber jetty with bollards, fenders and mooring cleats.
    Currently stood in for by GB-LOBBY-DOCK. Part of manifest group 08.
- id: GB-LOBBY-DOCK
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-LOBBY-HARBOUR-DOCK
  place: lobby
  roblox_path: Workspace.GB_SpawnDock
  feature: GAME-0013
  notes: 64 x 4 x 40 WoodPlanks slab at Y=2, Weathered Wood colour. Exists because the lobby has
    CharacterAutoLoads=true, so removing the baseplate would drop every joining player into the sea.
    Tagged Graybox with attribute GrayboxId=GB-LOBBY-DOCK. Keep the footprint when replacing - the
    spawn and future harbour layout are positioned against it.
- id: ASSET-HARBOUR-WATER
  type: terrain
  status: IMPLEMENTED
  source: studio
  roblox_path: Workspace.Terrain
  place: lobby
  feature: GAME-0013
  notes: Sheltered harbour, 4096 x 4096 studs. Sand -48..-40, water -40..0. Shallower, greener and
    calmer than the open sea (WaveSize 0.06, Transparency 0.42) so the lobby reads as a safe bay.
    Verified by voxel read-back.
- id: GB-GAME-DECK
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-BOAT-STARTER
  place: game
  roblox_path: Workspace.GB_ObservationDeck
  feature: GAME-0014
  notes: 48 x 2 x 32 DiamondPlate deck at Y=3 with four low rails, Wet Steel. Exists because the game
    place runs CharacterAutoLoads=false by design, so a developer pressing Play gets no body and there is
    nothing to stand on. Paired with the admin panel's 'Spawn me a character' tool. Represents the starter
    vessel because standing on the launch's DECK is what replaces this - so the graybox audit will keep
    reporting it until GAME-0001 lands, which is intended. Delete it then; do not build anything that
    depends on its position.
