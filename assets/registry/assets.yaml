    Tagged Graybox with attribute GrayboxId=GB-LOBBY-DOCK. Keep the footprint when replacing - the
    spawn and future harbour layout are positioned against it.
- id: ASSET-HARBOUR-WATER
  type: terrain
  status: IMPLEMENTED
  source: studio
  roblox_path: Workspace.Terrain
  place: lobby
  feature: GAME-0013
  notes: Sheltered harbour, 4096 x 4096 studs. Sand -48..-40, water -40..0. Shallower, greener and
    calmer than the open sea (WaveSize 0.06, Transparency 0.42) so the lobby reads as a safe bay.
    Verified by voxel read-back.
- id: GB-CLOUD-TEXTURE
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-CLOUD-WALL
  place: game
  roblox_path: ReplicatedStorage.CloudWallVFX
  feature: GAME-0003
  notes: >-
    The storm's cloud wall and all its rain/spray are built from BUILT-IN engine textures -
    rbxasset://textures/particles/smoke_main.dds for the cloud bank and spray, sparkles_main.dds for rain.
    Registered as graybox because smoke_main is standing in for real cloud art, and because the wall's whole
    look depends on one property of it: it is a soft radial ALPHA blob, so every particle fades to nothing at
    its own edge and the mass has no silhouette line anywhere. That is what made particles work where flat
    geometry failed - a transparent slab always reads as a grey card (job 018, four attempts). Approved by
    eye for the POC, so this is not urgent; the escalation, if it ever stops convincing, is a real cloud
    texture with an alpha channel. Costs nothing today and needs no moderation, which is why it shipped.
- id: ASSET-CLOUD-WALL
  type: image
  status: IDEA
  source: store
  roblox_path: ReplicatedStorage.CloudWallVFX
  place: game
  feature: GAME-0003
  notes: >-
    A real cloud texture with an alpha channel, to replace smoke_main.dds in the cloud wall if the built-in
    blob ever stops convincing. NOT currently needed - the particle bank was approved by eye on 2026-08-20.
    Requirements if it is ever sourced: soft alpha falloff at every edge (a hard-edged texture reintroduces
    the grey-card problem), no baked lighting or sun direction (the bank is lit by the scene at
    LightInfluence 0.25), and tileable or large enough that repetition is not visible across a 140-degree arc.
- id: GB-GAME-DECK
  type: graybox
  status: GRAYBOX
  source: studio
  represents: ASSET-BOAT-STARTER
  place: game
  roblox_path: Workspace.GB_ObservationDeck
  feature: GAME-0014
  notes: 48 x 2 x 32 DiamondPlate deck at Y=3 with four low rails, Wet Steel. Exists because the game
    place runs CharacterAutoLoads=false by design, so a developer pressing Play gets no body and there is
    nothing to stand on. Paired with the admin panel's 'Spawn me a character' tool. Represents the starter
    vessel because standing on the launch's DECK is what replaces this - so the graybox audit will keep
    reporting it until GAME-0001 lands, which is intended. Delete it then; do not build anything that
    depends on its position.
